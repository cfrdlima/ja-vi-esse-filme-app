name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nenhum passo escreve no repositório nem precisa de secret.
permissions:
  contents: read

# Cancela só em PR: na main, cada commit integrado precisa do seu resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flutter:
    name: Format, analyze e test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions de terceiros fixadas por SHA: uma tag pode ser movida.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
          pub-cache: true

      # Falha se o pubspec.lock não acompanhar o pubspec.yaml.
      - run: flutter pub get --enforce-lockfile

      # O pub get regenera o lib/l10n (decisão 004); o versionado tem de bater.
      # O status, e não o diff, pega também um gerado que falte no commit.
      - name: Código gerado em dia
        run: |
          changes="$(git status --porcelain -- lib/l10n)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- lib/l10n
            exit 1
          fi

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Sem --dart-define: o teste do AppConfig depende de rodar sem config.
      - name: Test
        run: flutter test

  firestore-rules:
    name: Regras do Firestore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore/package-lock.json

      # O emulador do Firestore recusa Java anterior ao 21 (decisão 012).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # O jar do emulador é baixado pela firebase-tools; muda com o lock.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore/package-lock.json') }}

      # Sem scripts de instalação: nenhum pacote precisa deles para o emulador.
      - run: npm ci --ignore-scripts

      # Projeto demo-: o emulador nunca fala com o projeto real.
      - run: npm test

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Histórico completo: um segredo removido num commit seguinte continua vazado.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Binário em vez da gitleaks-action, com o checksum fixado aqui e não
      # lido da mesma release que poderia ter sido adulterada.
      - name: Instalar gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Varrer o histórico
        run: ./gitleaks git --redact --no-banner --verbose .
