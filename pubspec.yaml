name: ja_vi_esse_filme
description: "App de filmes para cinéfilos: busque no TMDB, marque o que já viu, guarde favoritos e monte listas."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^4.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.0
  http: ^1.6.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Logo oficial do TMDB, rasterizado do SVG em 1x, 2x e 3x (sessão 014).
    - assets/images/tmdb_logo.png
    # Licenças das fontes, lidas pela página de licenças (LicenseRegistry).
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/PlayfairDisplay-OFL.txt

  # Fontes variáveis (OFL, google/fonts): o FontWeight controla o eixo wght.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
